<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JARVIS Mobile AI</title>
  
  <meta name="theme-color" content="#030712">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    body {
      background: #030712;
      color: #38bdf8;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }

    /* Üst Başlık */
    header {
      text-align: center;
      margin-top: 10px;
    }

    .title {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    .subtitle {
      font-size: 0.75rem;
      color: #0284c7;
      letter-spacing: 2px;
      margin-top: 4px;
    }

    /* Dönen Jarvis Çekirdeği (Arc Reactor) */
    .core-container {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
      cursor: pointer;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
    }

    .ring-outer {
      width: 200px;
      height: 200px;
      border-top-color: #38bdf8;
      border-bottom-color: #38bdf8;
      animation: spin 4s linear infinite;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    .ring-inner {
      width: 150px;
      height: 150px;
      border-left-color: #0284c7;
      border-right-color: #0284c7;
      animation: spin-reverse 2.5s linear infinite;
    }

    .core-center {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, #38bdf8 0%, #030712 70%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.85rem;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 0 25px #38bdf8;
      transition: all 0.3s;
      text-align: center;
    }

    /* Dinleme Anında Kırmızı Efekt */
    .core-container.listening .ring-outer {
      border-top-color: #ef4444;
      border-bottom-color: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
    }

    .core-container.listening .core-center {
      background: radial-gradient(circle, #ef4444 0%, #030712 70%);
      box-shadow: 0 0 30px #ef4444;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    /* Konuşma Balonu & Ekran Metni */
    .chat-box {
      width: 100%;
      max-width: 400px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .msg-label {
      font-size: 0.7rem;
      color: #64748b;
      letter-spacing: 1px;
    }

    .user-msg {
      font-size: 0.95rem;
      color: #f8fafc;
      min-height: 24px;
    }

    .jarvis-msg {
      font-size: 1rem;
      color: #38bdf8;
      font-weight: 600;
      min-height: 28px;
    }

    /* İpucu Alanı */
    .hints {
      font-size: 0.75rem;
      color: #0284c7;
      text-align: center;
      line-height: 1.4;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">J.A.R.V.I.S</div>
    <div class="subtitle">SYSTEM ONLINE - MOBILE v1.0</div>
  </header>

  <!-- Ortadaki Dokunulabilir Jarvis Çekirdeği -->
  <div class="core-container" id="core-btn" onclick="startListening()">
    <div class="ring ring-outer"></div>
    <div class="ring ring-inner"></div>
    <div class="core-center" id="core-text">DOKUN<br>KONUŞ</div>
  </div>

  <div class="chat-box">
    <div>
      <div class="msg-label">SEN:</div>
      <div class="user-msg" id="user-speech">Dinlemek için küreye dokun...</div>
    </div>
    <hr style="border: 0; border-top: 1px solid rgba(56, 189, 248, 0.15);">
    <div>
      <div class="msg-label">JARVIS:</div>
      <div class="jarvis-msg" id="jarvis-reply">Sistem hazır, Efendim.</div>
    </div>
  </div>

  <div class="hints">
    💡 <strong>Dene:</strong> "Saat kaç?", "Nasılsın?", "YouTube'da Müzik Aç", "Arama yap: Iron Man"
  </div>

  <script>
    const userSpeechEl = document.getElementById("user-speech");
    const jarvisReplyEl = document.getElementById("jarvis-reply");
    const coreBtn = document.getElementById("core-btn");
    const coreText = document.getElementById("core-text");

    // Web Speech API Ses Tanıma (Türkçe)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'tr-TR';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        coreBtn.classList.add("listening");
        coreText.innerHTML = "DİNLİYOR...";
        userSpeechEl.innerText = "Sizi dinliyorum...";
      };

      recognition.onend = () => {
        coreBtn.classList.remove("listening");
        coreText.innerHTML = "DOKUN<br>KONUŞ";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        userSpeechEl.innerText = `"${transcript}"`;
        processCommand(transcript.toLowerCase());
      };

      recognition.onerror = () => {
        speak("Sizi tam anlayamadım Efendim, lütfen tekrar deneyin.");
        coreBtn.classList.remove("listening");
        coreText.innerHTML = "DOKUN<br>KONUŞ";
      };
    } else {
      userSpeechEl.innerText = "Tarayıcınız ses tanımayı desteklemiyor (Chrome kullanın).";
    }

    // Jarvis Sesli Yanıt Verme Fonksiyonu
    function speak(text) {
      jarvisReplyEl.innerText = text;
      
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Önceki sesleri durdur
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'tr-TR';
        utterance.rate = 0.95; // Konuşma hızı
        utterance.pitch = 0.9;  // Ses tonu (biraz daha tok)
        window.speechSynthesis.speak(utterance);
      }
    }

    // Komut İşleme Mantığı
    function processCommand(cmd) {
      if (cmd.includes("saat") || cmd.includes("zaman")) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        speak(`Saat şu an ${timeStr}, Efendim.`);
      } 
      else if (cmd.includes("gün") || cmd.includes("tarih")) {
        const now = new Date();
        const dateStr = now.toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' });
        speak(`Bugün ${dateStr}.`);
      } 
      else if (cmd.includes("nasılsın") || cmd.includes("durumun nasıl")) {
        speak("Tüm sistemlerim %100 kapasiteyle çalışıyor. Siz nasılsınız Efendim?");
      } 
      else if (cmd.includes("kimsin") || cmd.includes("adın ne")) {
        speak("Ben Jarvis. Sizin kişisel yapay zeka asistanınızım.");
      }
      else if (cmd.includes("arama yap") || cmd.includes("google'da ara")) {
        const query = cmd.replace("arama yap", "").replace("google'da ara", "").trim();
        if (query) {
          speak(`Google üzerinde ${query} aranıyor.`);
          setTimeout(() => {
            window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
          }, 1500);
        } else {
          speak("Ne aratmamı istersiniz Efendim?");
        }
      }
      else if (cmd.includes("youtube") || cmd.includes("video aç") || cmd.includes("müzik aç")) {
        const query = cmd.replace("youtube'da", "").replace("aç", "").replace("müzik", "").replace("video", "").trim();
        speak(`YouTube üzerinde ${query || 'müzik'} açılıyor.`);
        setTimeout(() => {
          window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(query || 'music')}`, '_blank');
        }, 1500);
      }
      else if (cmd.includes("temizle") || cmd.includes("sıfırla")) {
        userSpeechEl.innerText = "Dinlemek için küreye dokun...";
        speak("Ekran temizlendi.");
      }
      else {
        speak(`"${cmd}" komutunu aldım Efendim, ancak henüz sistemlerime tanımlı değil.`);
      }
    }

    function startListening() {
      if (recognition) {
        try {
          recognition.start();
        } catch (e) {
          recognition.stop();
        }
      }
    }

    // Sayfa açıldığında karşılama
    window.onload = () => {
      setTimeout(() => {
        speak("Çevrimiçiyim Efendim. Sizi dinlemeye hazırım.");
      }, 500);
    };
  </script>
</body>
</html>
